<!DOCTYPE html>
<html lang="en">
<head>
    <title>ED Player | Typography</title>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Bangers&family=Bebas+Neue&family=Caveat:wght@700&family=Courier+Prime:wght@700&family=Dancing+Script:wght@700&family=Fredoka+One&family=Lato:wght@700&family=Lora:ital,wght@1,700&family=Merriweather:ital,wght@1,700&family=Montserrat:wght@700&family=Open+Sans:wght@700&family=Orbitron:wght@700&family=Oswald:wght@700&family=PT+Serif:ital,wght@1,700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,700&family=Press+Start+2P&family=Raleway:wght@700&family=Righteous&family=Roboto+Slab:wght@700&family=Roboto:wght@700&family=Satisfy&family=VT323&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        #render-canvas { width: 100vw; height: 100vh; position: relative; }
        .page { display: none; height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; }
        .active-page { display: block; }
        #drop-zone { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; color: #ff0000; font-size: 24px; font-weight: bold; letter-spacing: 2px; border: 4px dashed #ff0000; cursor: pointer; z-index: 10000; background: #000; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="render-canvas">
    <div id="drop-zone" onclick="document.getElementById('fileInput').click()">CLICK OR DRAG .ED FILE HERE</div>
    <input type="file" id="fileInput" style="display:none" accept=".ed">
    <div id="page-container"></div> 
</div>

<script>
    const canvas = document.getElementById('render-canvas');
    const input = document.getElementById('fileInput');
    
    let targetPageId = null; let firstPageId = null;

    const FONT_MAP = {
        'default': "-apple-system, BlinkMacSystemFont, sans-serif",
        'pixel': "'Press Start 2P', cursive", 'tech': "'Orbitron', sans-serif",
        'vt323': "'VT323', monospace", 'courier': "'Courier Prime', monospace",
        'bold': "'Bangers', cursive", 'bebas': "'Bebas Neue', sans-serif",
        'right': "'Righteous', cursive", 'amatic': "'Amatic SC', cursive", 'fredoka': "'Fredoka One', cursive",
        'messy': "'Permanent Marker', cursive", 'pacifico': "'Pacifico', cursive",
        'dance': "'Dancing Script', cursive", 'caveat': "'Caveat', cursive", 'satisfy': "'Satisfy', cursive",
        'roboto': "'Roboto', sans-serif", 'mont': "'Montserrat', sans-serif",
        'oswald': "'Oswald', sans-serif", 'raleway': "'Raleway', sans-serif",
        'open': "'Open Sans', sans-serif", 'lato': "'Lato', sans-serif",
        'fancy': "'Playfair Display', serif", 'merri': "'Merriweather', serif",
        'slab': "'Roboto Slab', serif", 'lora': "'Lora', serif", 'pt': "'PT Serif', serif"
    };

    input.addEventListener('change', (e) => loadFile(e.target.files[0]));
    canvas.ondragover = (e) => e.preventDefault();
    canvas.ondrop = (e) => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); };

    function loadFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => render(e.target.result);
        reader.readAsText(file);
        document.documentElement.requestFullscreen().catch(err => console.log(err));
        document.getElementById('drop-zone').style.display = 'none';
    }

    function ensurePageExists(id) {
        if (!document.getElementById(id)) {
            const div = document.createElement('div');
            div.id = id; div.className = 'page'; div.style.background = '#000'; 
            document.getElementById('page-container').appendChild(div);
        }
    }

    const ED_ENGINE = {
        'use': (args) => {
            const parts = args.split(' ');
            if (parts[0] === 'page') { if (!firstPageId) firstPageId = parts[1]; ensurePageExists(parts[1]); targetPageId = parts[1]; }
        },
        'new': (args) => {
            const parts = args.split(' ');
            if (parts[0] === 'page') { if (!firstPageId) firstPageId = parts[1]; ensurePageExists(parts[1]); targetPageId = parts[1]; }
        },
        'gradient': (args) => {
            if (!targetPageId) return;
            const parts = args.split(' '); const dirMap = { 'up': 'to top', 'down': 'to bottom', 'left': 'to left', 'right': 'to right' };
            const grad = `linear-gradient(${dirMap[parts[0]] || 'to bottom'}, ${parts.slice(1).join(', ')})`;
            ensurePageExists(targetPageId); const target = document.getElementById(targetPageId);
            if(target) target.style.background = grad;
        },
        'add': (args) => {
            if (!targetPageId) return;
            const parts = args.split(' '); let commandType = parts[0]; 
            ensurePageExists(targetPageId); const targetEl = document.getElementById(targetPageId); if (!targetEl) return;

            let content = [], color = "white", pos = "absolute", target = "", size = "24", font = "default";
            const posMap = { 
                'middle': 'top:50%; left:50%; transform:translate(-50%,-50%);',
                'top-left': 'top:30px; left:30px;', 'top-right': 'top:30px; right:30px;',
                'bottom-left': 'bottom:30px; left:30px;', 'bottom-right': 'bottom:30px; right:30px;'
            };
            
            let startIndex = 1; let imgUrl = "";

            if (commandType === 'button' && parts[1] === 'txt') { commandType = 'button-txt'; startIndex = 2; } 
            else if (commandType === 'img' && parts[1] === 'button') { commandType = 'img-button'; imgUrl = parts[2]; startIndex = 3; size = "150"; } 
            else if (commandType === 'img') { imgUrl = parts[1]; startIndex = 2; size = "200"; }

            for (let i = startIndex; i < parts.length; i++) {
                const p = parts[i];
                if (p.startsWith('c:')) { color = p.split(':')[1]; }
                else if (p.startsWith('p:')) { pos = posMap[p.split(':')[1]] || ''; }
                else if (p.startsWith('id:')) { target = p.split(':')[1]; }
                else if (p.startsWith('s:')) { size = p.split(':')[1]; }
                else if (p.startsWith('f:')) { font = p.split(':')[1]; } 
                else { content.push(p); } 
            }

            const chosenFont = FONT_MAP[font] || FONT_MAP['default'];

            if (commandType === 'button-txt') {
                const btn = document.createElement('button'); btn.innerText = content.join(' ');
                btn.style.cssText = `position: absolute; ${pos} padding: 18px 36px; background: ${color}; color: white; border-radius: 16px; border:1px solid rgba(255,255,255,0.2); cursor:pointer; font-size:${size}px; font-family:${chosenFont}; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index:10; transition: transform 0.2s ease;`;
                btn.onmouseover = () => btn.style.transform = pos.includes('translate') ? 'translate(-50%, -50%) scale(1.05)' : 'scale(1.05)';
                btn.onmouseout = () => btn.style.transform = pos.includes('translate') ? 'translate(-50%, -50%) scale(1)' : 'scale(1)';
                btn.onclick = () => { if(target) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); ensurePageExists(target); const targetPage = document.getElementById(target); if(targetPage) targetPage.classList.add('active-page'); } };
                targetEl.appendChild(btn);
            } 
            else if (commandType === 'txt') {
                const div = document.createElement('div');
                div.style.cssText = `position: absolute; ${pos} color: ${color}; font-size: ${size}px; font-family:${chosenFont}; text-shadow: 0 2px 10px rgba(0,0,0,0.5); white-space: nowrap; z-index:10;`;
                div.innerText = content.join(' '); targetEl.appendChild(div);
            }
            else if (commandType === 'img') {
                const img = document.createElement('img'); img.src = imgUrl;
                img.style.cssText = `position: absolute; ${pos} width: ${size}px; height: auto; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index:5;`;
                targetEl.appendChild(img);
            }
            else if (commandType === 'img-button') {
                const imgBtn = document.createElement('img'); imgBtn.src = imgUrl;
                imgBtn.style.cssText = `position: absolute; ${pos} width: ${size}px; height: auto; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index:10; cursor:pointer; transition: transform 0.2s ease;`;
                imgBtn.onmouseover = () => imgBtn.style.transform = pos.includes('translate') ? 'translate(-50%, -50%) scale(1.05)' : 'scale(1.05)';
                imgBtn.onmouseout = () => imgBtn.style.transform = pos.includes('translate') ? 'translate(-50%, -50%) scale(1)' : 'scale(1)';
                imgBtn.onclick = () => { if(target) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); ensurePageExists(target); const targetPage = document.getElementById(target); if(targetPage) targetPage.classList.add('active-page'); } };
                targetEl.appendChild(imgBtn);
            }
        },
        'txt': (args) => { ED_ENGINE['add'](`txt ${args}`); }
    };

    function render(code) {
        const container = document.getElementById('page-container'); container.innerHTML = ""; 
        targetPageId = null; firstPageId = null;
        code.split('\n').forEach(line => {
            const trimmed = line.trim(); if(!trimmed) return;
            const spaceIdx = trimmed.indexOf(' '); if(spaceIdx === -1) return;
            const cmd = trimmed.substring(0, spaceIdx); const args = trimmed.substring(spaceIdx + 1);
            if(ED_ENGINE[cmd]) ED_ENGINE[cmd](args);
        });
        if (firstPageId) { const startScreen = document.getElementById(firstPageId); if (startScreen) startScreen.classList.add('active-page'); }
    }
</script>
</body>
</html>
